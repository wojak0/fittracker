<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input { padding: 8px; width: 100%; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #218838; }
        .workout-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        
        /* New styling specifically for the delete button */
        .delete-btn { background-color: #dc3545; padding: 6px 12px; margin-top: 10px; font-size: 0.9em; }
        .delete-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <h1>Fit Tracker</h1>

    <!-- FORM TO ADD WORKOUTS -->
    <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
        <h3>Log a New Workout</h3>
        <form id="workout-form">
            <div class="form-group">
                <label>Exercise Title:</label>
                <input type="text" id="title" required placeholder="e.g., Bench Press">
            </div>
            <div class="form-group">
                <label>Sets:</label>
                <input type="number" id="sets" required min="1" placeholder="e.g., 3">
            </div>
            <div class="form-group">
                <label>Reps:</label>
                <input type="number" id="reps" required min="1" placeholder="e.g., 10">
            </div>
            <button type="submit">Save Workout</button>
        </form>
    </div>

    <!-- AREA TO DISPLAY WORKOUTS -->
    <h3>Your Workouts</h3>
    <div id="workout-list">
        <!-- JavaScript will populate workouts here -->
        <p>Loading workouts...</p>
    </div>

    <!-- THE JAVASCRIPT GOES RIGHT HERE, ABOVE </body> -->
    <script>
        const API_URL = "http://localhost:8888";

        // 1. Fetch and Display Workouts (GET)
        async function fetchWorkouts() {
            try {
                const response = await fetch(`${API_URL}/workouts/`);
                const workouts = await response.json();
                
                const listDiv = document.getElementById("workout-list");
                listDiv.innerHTML = ""; // Clear the "Loading..." text

                if (workouts.length === 0) {
                    listDiv.innerHTML = "<p>No workouts logged yet. Add one above!</p>";
                    return;
                }

                workouts.forEach(workout => {
                    const card = document.createElement("div");
                    card.className = "workout-card";
                    
                    // Added the HTML for the Delete Button here!
                    card.innerHTML = `
                        <strong>${workout.title}</strong><br>
                        Sets: ${workout.sets} | Reps: ${workout.reps}<br>
                        <button class="delete-btn" onclick="deleteWorkout(${workout.id})">Delete</button>
                    `;
                    listDiv.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching workouts:", error);
                document.getElementById("workout-list").innerHTML = "<p style='color: red;'>Error connecting to backend.</p>";
            }
        }

        // 2. Handle Deletion (DELETE)
        async function deleteWorkout(id) {
            // Ask the user to confirm before deleting
            if (!confirm("Are you sure you want to delete this workout?")) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/workouts/${id}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    console.log("Workout deleted successfully");
                    fetchWorkouts(); // Refresh the list to show it is gone
                } else {
                    console.error("Failed to delete the workout.");
                    alert("Failed to delete the workout. Check the console for details.");
                }
            } catch (error) {
                console.error("Error deleting workout:", error);
            }
        }

        // 3. Handle Form Submission (POST)
        document.getElementById("workout-form").addEventListener("submit", async (e) => {
            e.preventDefault(); // Prevents the page from refreshing

            const title = document.getElementById("title").value;
            const sets = parseInt(document.getElementById("sets").value);
            const reps = parseInt(document.getElementById("reps").value);

            try {
                const response = await fetch(`${API_URL}/workouts/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, sets, reps })
                });

                if (response.ok) {
                    document.getElementById("workout-form").reset(); // Clear the form
                    fetchWorkouts(); // Instantly refresh the list
                } else {
                    alert("Error saving workout. Check the console.");
                }
            } catch (error) {
                console.error("Error saving workout:", error);
                alert("Could not connect to the backend.");
            }
        });

        // 4. Load workouts as soon as the page opens
        fetchWorkouts();
    </script>
</body>
</html>
