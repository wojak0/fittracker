name: Build Debian Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-debian-package:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ruby \
            ruby-dev \
            build-essential \
            python3-tk \
            libx11-6 \
            libxext6 \
            libxrender1 \
            libxft2 \
            libfontconfig1
          python -m pip install --upgrade pip uv
          sudo gem install fpm --no-document

      - name: Build Debian installer
        run: make deb

      - name: Validate Debian installer
        run: |
          DEB_FILE="$(find frontend/dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB_FILE"
          dpkg-deb --info "$DEB_FILE"
          dpkg-deb --contents "$DEB_FILE"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v6
        with:
          name: fittracker-debian-package
          path: frontend/dist/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEB_FILE="$(find frontend/dist -maxdepth 1 -name '*.deb' -print -quit)"
          gh release create "${GITHUB_REF_NAME}" "$DEB_FILE" \
            --title "Fit Tracker ${GITHUB_REF_NAME}" \
            --generate-notes
