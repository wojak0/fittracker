name: Documentation PDF Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Build LaTeX PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-lang-german \
            texlive-latex-extra

      - name: Build all documentation
        run: make docs

      - name: Validate generated PDFs
        run: |
          test -s out/dbms_10.pdf
          test -s out/proposal.pdf
          test -s out/documentation.pdf
          test -s out/user-manual.pdf
          test -s out/developer-manual.pdf

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v6
        with:
          name: fittracker-documentation-pdfs
          path: out/*.pdf
          if-no-files-found: error
          retention-days: 14
