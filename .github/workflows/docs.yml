name: Documentation PDF Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Build Fit Tracker documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-lang-german \
            texlive-latex-extra

      - name: Build Fit Tracker documentation
        run: |
          make docs
          cp documentation/proposal.pdf out/Proposal.pdf

      - name: Validate generated documentation
        run: |
          test -s out/Proposal.pdf
          test -s out/user-manual.pdf
          test -s out/developer-manual.pdf

      - name: Upload Fit Tracker documentation
        uses: actions/upload-artifact@v6
        with:
          name: fittracker-submission-documents
          path: |
            out/Proposal.pdf
            out/user-manual.pdf
            out/developer-manual.pdf
          if-no-files-found: error
          retention-days: 14
